name: Extended Multi-Language Verification

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - 'lean4/**'
      - 'coq/**'
      - 'isabelle/**'
      - 'agda/**'
      - 'rust/**'
      - 'cpp/**'
      - 'haskell/**'

permissions:
  contents: read

jobs:
  run-lean4:
    name: Lean 4 Formal Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Cache Mathlib4
        uses: actions/cache@v4
        with:
          path: lean4/.lake
          key: lean4-${{ runner.os }}-${{ hashFiles('lean4/lakefile.lean') }}
      - name: Build
        working-directory: lean4
        run: lake build

  run-coq:
    name: Coq Formal Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq
        run: sudo apt-get update && sudo apt-get install -y coq
      - name: Build
        working-directory: coq
        run: |
          coq_makefile -f _CoqProject -o Makefile
          make

  run-rust:
    name: Rust Numerical Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and run all sections
        working-directory: rust
        run: |
          cargo build --release
          for s in section1_correction_b section2_preprint section3_ab_cloud section4_kdv section5_klein_attractor section6_riemann_zeros; do
            cargo run --release -p $s
          done

  run-cpp:
    name: C++ Numerical Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Build
        working-directory: cpp
        run: mkdir -p build && cd build && cmake .. && make -j$(nproc)
      - name: Run all sections
        working-directory: cpp/build
        run: |
          for s in section1_correction_b section2_preprint section3_ab_cloud section4_kdv section5_klein_attractor section6_riemann_zeros; do
            ./verify_$s
          done

  run-haskell:
    name: Haskell Numerical Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4'
          cabal-version: '3.10'
      - name: Build
        working-directory: haskell
        run: cabal update && cabal build all

  aggregate:
    name: Aggregation
    runs-on: ubuntu-latest
    needs: [run-lean4, run-coq, run-rust, run-cpp, run-haskell]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Extended Multi-Language Verification" >> $GITHUB_STEP_SUMMARY
          echo "7 languages x 6 sections = 42 artifacts" >> $GITHUB_STEP_SUMMARY
