name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Python ${{ matrix.python-version }} syntax check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python syntax (py_compile)
        run: |
          echo "=== Checking Python files for syntax errors ==="
          FAIL=0
          COUNT=0
          PASS=0
          while IFS= read -r -d '' file; do
            COUNT=$((COUNT + 1))
            if python -m py_compile "$file" 2>/dev/null; then
              PASS=$((PASS + 1))
            else
              echo "::error file=$file::Syntax error in $file"
              python -m py_compile "$file" 2>&1
              FAIL=$((FAIL + 1))
            fi
          done < <(find src/ab-cloud-3d/code -name '*.py' -print0)
          echo ""
          echo "=== Summary ==="
          echo "Total files: $COUNT"
          echo "Passed:      $PASS"
          echo "Failed:      $FAIL"
          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "::error::$FAIL Python file(s) have syntax errors"
            exit 1
          fi
          echo "All Python files pass syntax check."

      - name: Install dependencies
        run: |
          pip install --quiet -r src/ab-cloud-3d/requirements.txt

      - name: Verify package metadata
        run: |
          cd src/ab-cloud-3d/
          python -c "import numpy; print(f'numpy {numpy.__version__}')"
          python -c "import scipy; print(f'scipy {scipy.__version__}')"
          python -c "import matplotlib; print(f'matplotlib {matplotlib.__version__}')"
          python -c "import sympy; print(f'sympy {sympy.__version__}')"
          python -c "import mpmath; print(f'mpmath {mpmath.__version__}')"
