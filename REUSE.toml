SPDX-License-Identifier = "NOASSERTION"

[[annotations]]
path = [
  ".github/workflows/**",
  ".github/ISSUE_TEMPLATE/**",
  ".github/*.yml",
  ".gitignore",
  ".editorconfig",
  ".gitattributes",
  ".pre-commit-config.yaml",
  ".markdownlint.json",
  ".yamllint.yml",
  ".commitlintrc.json",
  "Makefile",
  "environment.yml",
  "mkdocs.yml",
  "pyproject.toml",
  "codecov.yml"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Isaev Iskhak Khamzatovich"
