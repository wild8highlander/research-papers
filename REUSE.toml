version = 1

[[annotations]]
path = [
  "papers/**",
  "docs/**",
  "verification/**/README.md",
  "**/*.pdf",
  "**/*.tex",
  "**/*.py",
  "**/*.jl",
  "**/*.rs",
  "**/*.cpp",
  "**/*.hpp",
  "**/*.lean",
  "**/*.v",
  "**/*.thy",
  "**/*.agda",
  "**/*.hs",
  "**/*.cabal"
]
precedence = "aggregate"
