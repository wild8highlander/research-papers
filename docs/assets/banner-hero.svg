<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="Research Papers — monumental banner">
  <defs>
    <!-- Deep navy background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071120"/>
      <stop offset="0.45" stop-color="#0B1D3A"/>
      <stop offset="1" stop-color="#050B18"/>
    </linearGradient>
    <!-- Radial glow behind the title -->
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#1B3A6B" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#122A50" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0B1D3A" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold text gradient -->
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E08A"/>
      <stop offset="0.45" stop-color="#E9C55C"/>
      <stop offset="0.75" stop-color="#C89B2C"/>
      <stop offset="1" stop-color="#EACB6B"/>
    </linearGradient>
    <linearGradient id="goldRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C89B2C" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#D9B54A" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#F3D97C"/>
      <stop offset="0.8" stop-color="#D9B54A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#C89B2C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7D6EC"/>
      <stop offset="1" stop-color="#8FA6C6"/>
    </linearGradient>
    <!-- Watermark text gradient (barely visible) -->
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9B54A" stop-opacity="0.015"/>
      <stop offset="0.5" stop-color="#F3D97C" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#D9B54A" stop-opacity="0.015"/>
    </linearGradient>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <!-- Faint motif: critical line with Riemann zero ticks (left) -->
  <g stroke="#D9B54A" stroke-opacity="0.10" stroke-width="2">
    <line x1="70" y1="210" x2="380" y2="210"/>
  </g>
  <g fill="#E9C55C" fill-opacity="0.16">
    <circle cx="110" cy="210" r="3.2"/><circle cx="152" cy="197" r="2.4"/><circle cx="196" cy="221" r="2.8"/>
    <circle cx="238" cy="190" r="2.2"/><circle cx="276" cy="228" r="2.6"/><circle cx="318" cy="203" r="2.3"/>
    <circle cx="352" cy="214" r="2.0"/>
  </g>
  <!-- Faint motif: vortex spiral (right) -->
  <g fill="none" stroke="#D9B54A" stroke-opacity="0.12" stroke-width="2">
    <path d="M 1290 210
             m 0 -6
             a 6 6 0 1 1 -6 6
             a 14 14 0 1 1 14 -14
             a 26 26 0 1 1 -26 26
             a 40 40 0 1 1 40 -40
             a 56 56 0 1 1 -56 56
             a 72 72 0 1 1 72 -72"/>
  </g>

  <!-- ===== Monument plaque frame ===== -->
  <rect x="26" y="26" width="1548" height="368" fill="none" stroke="#C89B2C" stroke-width="2" stroke-opacity="0.9"/>
  <rect x="38" y="38" width="1524" height="344" fill="none" stroke="#D9B54A" stroke-width="0.9" stroke-opacity="0.55"/>
  <!-- Corner ornaments -->
  <g fill="none" stroke="#E9C55C" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round">
    <path d="M 26 66 V 26 H 66"/><path d="M 1534 26 H 1574 V 66"/>
    <path d="M 1574 354 V 394 H 1534"/><path d="M 66 394 H 26 V 354"/>
  </g>
  <g fill="#E9C55C" fill-opacity="0.9">
    <circle cx="26" cy="26" r="2.6"/><circle cx="1574" cy="26" r="2.6"/>
    <circle cx="1574" cy="394" r="2.6"/><circle cx="26" cy="394" r="2.6"/>
  </g>

  <!-- ===== Top ornament ===== -->
  <g transform="translate(800,74)">
    <line x1="-150" y1="0" x2="-26" y2="0" stroke="#D9B54A" stroke-width="1.6" stroke-opacity="0.7"/>
    <line x1="26" y1="0" x2="150" y2="0" stroke="#D9B54A" stroke-width="1.6" stroke-opacity="0.7"/>
    <path d="M 0 -12 L 9 0 L 0 12 L -9 0 Z" fill="none" stroke="#E9C55C" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="2.4" fill="#F3D97C"/>
    <circle cx="-26" cy="0" r="2" fill="#D9B54A"/>
    <circle cx="26" cy="0" r="2" fill="#D9B54A"/>
  </g>

  <!-- ===== Title ===== -->
  <text x="800" y="178" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold"
        letter-spacing="14" fill="url(#goldText)">RESEARCH PAPERS</text>

  <!-- ===== Subtitle ===== -->
  <text x="800" y="228" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="27"
        letter-spacing="2.5" fill="url(#steel)">Correction <tspan font-style="italic">b</tspan> · 3D Navier–Stokes Regularity · AB-Cloud · Riemann ζ-Zeros</text>

  <!-- ===== Mid rule with diamonds ===== -->
  <g transform="translate(800,262)">
    <line x1="-430" y1="0" x2="-18" y2="0" stroke="#D9B54A" stroke-width="1.4" stroke-opacity="0.8"/>
    <line x1="18" y1="0" x2="430" y2="0" stroke="#D9B54A" stroke-width="1.4" stroke-opacity="0.8"/>
    <path d="M 0 -7 L 6 0 L 0 7 L -6 0 Z" fill="#E9C55C"/>
    <path d="M -430 -4 L -425 0 L -430 4 L -435 0 Z" fill="#D9B54A"/>
    <path d="M 430 -4 L 425 0 L 430 4 L 435 0 Z" fill="#D9B54A"/>
  </g>

  <!-- ===== Author line ===== -->
  <text x="800" y="308" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold"
        letter-spacing="3" fill="#EDDFA6">ISAEV ISKHAK KHAMZATOVICH</text>
  <text x="800" y="342" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="19"
        letter-spacing="1.6" fill="#9FB4D4">ORCID 0009-0003-7299-0701 · Independent Researcher</text>

  <!-- ===== Bottom credentials ===== -->
  <text x="800" y="376" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="17"
        letter-spacing="1.4" fill="#C89B2C">Eleven-Language Formal Verification · 37-Test Suite · DOI 10.5281/zenodo.21825394</text>
</svg>
